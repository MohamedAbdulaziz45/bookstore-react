<div class="admin-panel active d-block">
  <div class="dash-section-title mb-4">Settings</div>

  @if (loading) {
  <div class="admin-state">Saving...</div>
  }
  @if (error) {
  <div class="admin-state error mb-3">{{ error }}</div>
  }
  @if (success) {
  <div class="admin-state success mb-3">{{ success }}</div>
  }

  <div class="card-box mb-4">
    <div style="font-weight:700;margin-bottom:16px;font-size:.95rem">
      <i class="bi bi-person-circle me-2"></i>Admin Profile
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="form-label-sm">Display Name</div>
        <input class="form-control-custom" type="text" [(ngModel)]="profile.displayName" />
      </div>
      <div class="col-md-6">
        <div class="form-label-sm">Phone</div>
        <input class="form-control-custom" type="tel" [(ngModel)]="profile.phoneNumber" />
      </div>
      <div class="col-md-6">
        <div class="form-label-sm">First Name</div>
        <input class="form-control-custom" type="text" [(ngModel)]="profile.firstName" />
      </div>
      <div class="col-md-6">
        <div class="form-label-sm">Last Name</div>
        <input class="form-control-custom" type="text" [(ngModel)]="profile.lastName" />
      </div>
      <div class="col-md-12">
        <div class="form-label-sm">Profile Image</div>
        <input class="form-control-custom" type="file" accept="image/*" (change)="onImageSelected($event)" />
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn-gold-cust" type="button" (click)="saveProfile()">Save Changes</button>
      <button class="btn-outline-cust" type="button" (click)="loadProfile()">Cancel</button>
    </div>
  </div>

  <div class="card-box mb-4">
    <div style="font-weight:700;margin-bottom:16px;font-size:.95rem">
      <i class="bi bi-shield-lock me-2"></i>Password
    </div>
    <div class="row g-3">
      <div class="col-md-4">
        <div class="form-label-sm">Current Password</div>
        <input class="form-control-custom" type="password" [(ngModel)]="password.currentPassword" />
      </div>
      <div class="col-md-4">
        <div class="form-label-sm">New Password</div>
        <input class="form-control-custom" type="password" [(ngModel)]="password.newPassword" />
      </div>
      <div class="col-md-4">
        <div class="form-label-sm">Confirm Password</div>
        <input class="form-control-custom" type="password" [(ngModel)]="password.confirmNewPassword" />
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn-gold-cust" type="button" (click)="changePassword()">Change Password</button>
    </div>
  </div>
</div>
